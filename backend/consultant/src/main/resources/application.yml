langchain4j:
  open-ai:
    chat-model:
      base-url: ${LLM_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${ALIYUNCS_API_KEY}
      model-name: ${LLM_MODEL_NAME:qwen3.7-flash}
      log-requests: false
      log-responses: false
    streaming-chat-model:
      base-url: ${LLM_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${ALIYUNCS_API_KEY}
      model-name: ${LLM_MODEL_NAME:qwen3.7-flash}
      log-requests: false
      log-responses: false
logging:
  level:
    dev.langchain4j: info

spring:
  application:
    name: cityhub-ai
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}



  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/cityhub?useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

mybatis:
  configuration:
    map-underscore-to-camel-case: true

mybatis-plus:
  type-aliases-package: com.cityhub.consultant.pojo # mybatis-plus的别名扫描包

server:
  port: 8084
  tomcat:
    uri-encoding: UTF-8

# 健康检查配置
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
