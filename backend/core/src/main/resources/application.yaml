server:
  port: 8081
spring:
  application:
    name: cityhub-core
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/cityhub?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 5s
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
  # AI服务配置
ai:
  consultant:
    url: http://localhost:8084


mybatis-plus:
  type-aliases-package: com.cityhub.entity # 别名扫描包
logging:
  level:
    com.cityhub: debug
